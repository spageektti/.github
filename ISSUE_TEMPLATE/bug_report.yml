name: 🐛 Bug Report
description: Create a report to help reproduce and fix a bug.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report an issue! Please search existing issues first.
  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of what the bug is.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: What steps do we need to take to reproduce this?
      placeholder: |
        1. Run command '...'
        2. Pass argument '...'
        3. See error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment Info
      description: OS, version, shell, runtime/compiler version, etc.
      placeholder: "OS: Linux (CachyOS) / macOS / Windows\nVersion: v1.0.0"
    validations:
      required: false
